[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boukensha-py"
# Keep in sync with boukensha/version.py's VERSION by hand — pyproject.toml
# is static TOML, there's no equivalent of Ruby's gemspec reading
# Boukensha::VERSION programmatically.
version = "0.9.0"
description = "BOUKENSHA — a tiny teaching framework for coding harnesses (Python port)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML",
    "python-dotenv",
]

[project.scripts]
boukensha-py = "boukensha_loader:main"

[tool.setuptools]
py-modules = ["boukensha_loader"]
